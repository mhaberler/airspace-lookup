name: CI

"on":
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - run: bun install
      - run: bun run build

      # E2E smoke (no snapshot baseline required)
      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium

      - name: Smoke test
        run: bun x playwright test e2e/smoke.spec.ts
